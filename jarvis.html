<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>JARVIS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c: #00d4ff;
    --gold: #ffaa00;
    --bg: #030810;
    --text: #a8d8f0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  /* HUD corners */
  .corner {
    position: fixed;
    width: 20px; height: 20px;
    z-index: 1;
    opacity: .35;
  }
  .corner::before, .corner::after { content: ''; position: absolute; background: var(--c); }
  .corner::before { width: 2px; height: 100%; }
  .corner::after { width: 100%; height: 2px; }
  .corner.tl { top: 6px; left: 6px; }
  .corner.tr { top: 6px; right: 6px; transform: scaleX(-1); }
  .corner.bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
  .corner.br { bottom: 6px; right: 6px; transform: scale(-1); }

  /* Header */
  #header {
    position: relative;
    z-index: 10;
    padding: 14px 18px 10px;
    border-bottom: 1px solid rgba(0,212,255,.12);
    background: linear-gradient(180deg, rgba(3,8,16,.97) 0%, rgba(3,8,16,.85) 100%);
    flex-shrink: 0;
  }

  .hud-top { display: flex; align-items: center; justify-content: space-between; }

  .logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--c);
    letter-spacing: 5px;
    text-shadow: 0 0 25px rgba(0,212,255,.5);
  }
  .logo small {
    display: block;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(0,212,255,.35);
    font-family: 'Share Tech Mono', monospace;
    margin-top: 1px;
    font-weight: 300;
  }

  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  #brain-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 3px 9px;
    border: 1px solid rgba(0,212,255,.3);
    color: rgba(0,212,255,.7);
    border-radius: 2px;
    transition: all .3s;
    letter-spacing: 1px;
  }
  #brain-badge.claude {
    border-color: rgba(255,170,0,.5);
    color: var(--gold);
    box-shadow: 0 0 12px rgba(255,170,0,.2);
  }

  #clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(0,212,255,.35);
  }

  .scanline {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--c), transparent);
    animation: scan 4s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes scan { 0%,100%{opacity:0;transform:scaleX(0)} 50%{opacity:.4;transform:scaleX(1)} }

  /* Status bar */
  #status-bar {
    height: 2px;
    flex-shrink: 0;
    background: transparent;
    overflow: hidden;
    z-index: 10;
  }
  #status-bar.active::after {
    content: '';
    display: block;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--c), transparent);
    animation: progress 1.5s ease-in-out infinite;
  }
  @keyframes progress {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  #status-bar.claude.active::after { background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  /* Chat log */
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    position: relative;
    z-index: 5;
    scroll-behavior: smooth;
  }
  #chat-log::-webkit-scrollbar { width: 2px; }
  #chat-log::-webkit-scrollbar-thumb { background: rgba(0,212,255,.15); }

  .welcome {
    text-align: center;
    padding: 32px 20px 20px;
  }
  .welcome .big {
    font-size: 64px;
    font-weight: 700;
    color: var(--c);
    letter-spacing: 12px;
    text-shadow: 0 0 40px rgba(0,212,255,.4), 0 0 80px rgba(0,212,255,.15);
    display: block;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 30px rgba(0,212,255,.4); }
    50% { text-shadow: 0 0 50px rgba(0,212,255,.7), 0 0 100px rgba(0,212,255,.2); }
  }
  .welcome .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(0,212,255,.3);
    font-family: 'Share Tech Mono', monospace;
    margin-top: 6px;
  }
  .welcome p {
    font-size: 13px;
    color: rgba(168,216,240,.4);
    margin-top: 20px;
    letter-spacing: 1px;
  }

  .msg {
    margin-bottom: 14px;
    animation: msgIn .25s ease forwards;
    opacity: 0;
    transform: translateY(6px);
  }
  @keyframes msgIn { to { opacity: 1; transform: translateY(0); } }

  .msg-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .msg-label::after { content: ''; flex: 1; height: 1px; background: currentColor; opacity: .1; }

  .msg.user .msg-label { color: rgba(168,216,240,.4); }
  .msg.jarvis .msg-label { color: var(--c); }
  .msg.jarvis.claude .msg-label { color: var(--gold); }

  .msg-body {
    font-size: 15px;
    line-height: 1.65;
    padding: 10px 14px;
    border-radius: 3px;
    border-left: 2px solid;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-body {
    background: rgba(168,216,240,.03);
    border-color: rgba(168,216,240,.15);
    color: rgba(168,216,240,.75);
  }
  .msg.jarvis .msg-body {
    background: rgba(0,212,255,.04);
    border-color: var(--c);
    color: #cceeff;
  }
  .msg.jarvis.claude .msg-body {
    background: rgba(255,170,0,.04);
    border-color: var(--gold);
    color: #ffeebb;
  }

  /* Typing indicator */
  #typing { display: none; margin-bottom: 14px; align-items: center; gap: 10px; }
  #typing.show { display: flex; }
  .typing-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--c); letter-spacing: 2px; }
  #typing.claude .typing-label { color: var(--gold); }
  .dots { display: flex; gap: 5px; }
  .dots span { width: 5px; height: 5px; background: var(--c); border-radius: 50%; animation: dot 1.1s ease-in-out infinite; opacity: .3; }
  #typing.claude .dots span { background: var(--gold); }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%,80%,100%{opacity:.3;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

  /* Input bar */
  #input-bar {
    z-index: 10;
    padding: 10px 14px 14px;
    border-top: 1px solid rgba(0,212,255,.1);
    background: linear-gradient(0deg, rgba(3,8,16,.97) 0%, rgba(3,8,16,.85) 100%);
    flex-shrink: 0;
  }

  #waveform { display: none; justify-content: center; align-items: center; gap: 3px; height: 22px; margin-bottom: 8px; }
  #waveform.show { display: flex; }
  #waveform span { display: block; width: 3px; border-radius: 2px; background: #ff4444; animation: wave .5s ease-in-out infinite; }
  #waveform span:nth-child(2n) { animation-delay: .12s; }
  @keyframes wave { 0%,100%{height:3px} 50%{height:18px} }

  .input-wrap {
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(0,212,255,.03);
    border: 1px solid rgba(0,212,255,.18);
    border-radius: 6px;
    padding: 4px 4px 4px 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-wrap:focus-within {
    border-color: rgba(0,212,255,.45);
    box-shadow: 0 0 18px rgba(0,212,255,.07);
  }

  #msg-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 8px 0;
  }
  #msg-input::placeholder { color: rgba(0,212,255,.2); }

  .btn-action {
    width: 40px; height: 40px;
    border: 1px solid rgba(0,212,255,.2);
    background: rgba(0,212,255,.06);
    color: rgba(0,212,255,.6);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    flex-shrink: 0;
  }
  .btn-action:active { background: rgba(0,212,255,.15); }

  #btn-send { border-color: rgba(0,212,255,.35); color: var(--c); background: rgba(0,212,255,.1); }

  .btn-action.listening {
    background: rgba(255,50,50,.15);
    border-color: rgba(255,50,50,.4);
    color: #ff4444;
    animation: pulseMic .8s ease infinite;
  }
  @keyframes pulseMic {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,50,50,.3); }
    50% { box-shadow: 0 0 0 6px rgba(255,50,50,0); }
  }

  /* Footer */
  #footer {
    padding: 3px 16px 5px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: rgba(0,212,255,.18);
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 10;
  }
  #footer-status { color: rgba(0,212,255,.3); }
</style>
</head>
<body>

<!-- Pantalla de arranque -->
<div id="boot-screen" style="
  position:fixed;inset:0;z-index:999;
  background:#030810;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;
">
  <div style="font-family:'Rajdhani',sans-serif;text-align:center">
    <div style="font-size:72px;font-weight:700;color:#00d4ff;letter-spacing:12px;
                text-shadow:0 0 40px rgba(0,212,255,.5);
                animation:bootPulse 1.5s ease-in-out infinite">J</div>
    <div style="font-size:11px;letter-spacing:4px;color:rgba(0,212,255,.4);
                font-family:'Share Tech Mono',monospace;margin-top:8px">J.A.R.V.I.S</div>
    <div style="margin-top:40px;font-size:13px;color:rgba(0,212,255,.3);
                letter-spacing:2px;animation:bootBlink 1s ease-in-out infinite">
      TOCA PARA ACTIVAR
    </div>
  </div>
</div>

<style>
@keyframes bootPulse {
  0%,100%{text-shadow:0 0 30px rgba(0,212,255,.4)}
  50%{text-shadow:0 0 60px rgba(0,212,255,.8),0 0 120px rgba(0,212,255,.3)}
}
@keyframes bootBlink {
  0%,100%{opacity:.3} 50%{opacity:1}
}
</style>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div id="header">
  <div class="hud-top">
    <div class="logo">
      J.A.R.V.I.S
      <small>JUST A RATHER VERY INTELLIGENT SYSTEM</small>
    </div>
    <div class="hud-right">
      <div id="brain-badge">◈ GROQ</div>
      <div id="clock">--:--:--</div>
    </div>
  </div>
  <div class="scanline"></div>
</div>

<div id="status-bar"></div>

<div id="chat-log">
  <div class="welcome">
    <span class="big">J</span>
    <span class="sub">SISTEMA ACTIVO · CEREBRO DUAL ACTIVADO</span>
    <p id="welcome-text">Iniciando sistemas...</p>
  </div>
  <div id="typing">
    <div class="typing-label" id="typing-label">GROQ</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="input-bar">
  <div id="waveform">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="input-wrap">
    <input id="msg-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn-action" id="btn-mic" title="Voz">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="btn-action" id="btn-send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<div id="footer">
  <span>GROQ · QWEN3-27B</span>
  <span id="footer-status">STANDBY</span>
  <span>CLAUDE · HAIKU</span>
</div>

<script>
const chatLog   = document.getElementById('chat-log');
const msgInput  = document.getElementById('msg-input');
const btnSend   = document.getElementById('btn-send');
const btnMic    = document.getElementById('btn-mic');
const brainBadge = document.getElementById('brain-badge');
const clockEl   = document.getElementById('clock');
const typingEl  = document.getElementById('typing');
const typingLbl = document.getElementById('typing-label');
const statusBar = document.getElementById('status-bar');
const footerStatus = document.getElementById('footer-status');
const waveform  = document.getElementById('waveform');

// Clock
function tick() {
  clockEl.textContent = new Date().toLocaleTimeString('es-ES', {hour12: false});
}
tick();
setInterval(tick, 1000);

function setBrain(brain) {
  if (brain === 'CLAUDE') {
    brainBadge.textContent = '⚡ CLAUDE';
    brainBadge.className = 'claude';
    typingLbl.textContent = '⚡ CLAUDE';
    typingEl.className = 'show claude';
    statusBar.className = 'active claude';
    footerStatus.textContent = '⚡ CLAUDE PROCESANDO';
  } else {
    brainBadge.textContent = '◈ GROQ';
    brainBadge.className = '';
    typingLbl.textContent = '◈ GROQ';
    typingEl.className = 'show';
    statusBar.className = 'active';
    footerStatus.textContent = 'GROQ PROCESANDO';
  }
}

function setLoading(on, brain) {
  if (on) {
    setBrain(brain || 'GROQ');
    typingEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
  } else {
    typingEl.className = '';
    statusBar.className = '';
    footerStatus.textContent = 'STANDBY';
  }
}

function addMsg(role, text, brain) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (brain === 'CLAUDE' ? ' claude' : '');

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user'
    ? 'TÚ'
    : (brain === 'CLAUDE' ? 'JARVIS · CLAUDE ⚡' : 'JARVIS · GROQ ◈');

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.textContent = text;

  div.appendChild(label);
  div.appendChild(body);
  chatLog.insertBefore(div, typingEl);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  msgInput.value = '';
  msgInput.disabled = true;
  btnSend.disabled = true;

  addMsg('user', text);
  setLoading(true);

  // Burbuja de respuesta vacía que se rellena progresivamente
  let brain = 'GROQ';
  const bubble = document.createElement('div');
  bubble.className = 'msg jarvis';
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'JARVIS · GROQ ◈';
  const body = document.createElement('div');
  body.className = 'msg-body';
  bubble.appendChild(label);
  bubble.appendChild(body);
  chatLog.insertBefore(bubble, typingEl);

  // Cola de audio
  const audioQueue = [];
  let isPlaying = false;

  function playNext() {
    if (!audioQueue.length) { isPlaying = false; return; }
    isPlaying = true;
    const url = audioQueue.shift();
    const a = new Audio(url);
    a.onended = playNext;
    a.onerror = playNext;
    a.play().catch(playNext);
  }

  try {
    const res = await fetch('/chat-stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'brain') {
            brain = ev.brain;
            bubble.className = 'msg jarvis' + (brain === 'CLAUDE' ? ' claude' : '');
            label.textContent = brain === 'CLAUDE' ? 'JARVIS · CLAUDE ⚡' : 'JARVIS · GROQ ◈';
            setBrain(brain);
          }
          if (ev.type === 'text') {
            body.textContent += ev.text;
            bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
          if (ev.type === 'audio') {
            audioQueue.push(ev.url);
            if (!isPlaying) playNext();
          }
        } catch {}
      }
    }
  } catch (e) {
    body.textContent = '⚠ Sin conexión con el servidor.';
  } finally {
    setLoading(false);
    msgInput.disabled = false;
    btnSend.disabled = false;
    msgInput.focus();
  }
}

btnSend.addEventListener('click', () => send(msgInput.value));
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) send(msgInput.value); });

// Voice
let recognition = null;
let isListening = false;
let accumulatedTranscript = '';

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'es-ES';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    accumulatedTranscript = '';
    btnMic.classList.add('listening');
    waveform.classList.add('show');
    msgInput.placeholder = 'Escuchando... (toca para enviar)';
  };

  recognition.onend = () => {
    isListening = false;
    btnMic.classList.remove('listening');
    waveform.classList.remove('show');
    msgInput.placeholder = 'Escribe un mensaje...';
    // Si Android cortó el reconocimiento y hay texto acumulado → enviar
    const text = (accumulatedTranscript || msgInput.value).trim();
    if (text) { msgInput.value = ''; accumulatedTranscript = ''; send(text); }
  };

  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) accumulatedTranscript += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    // Mostrar en el input lo acumulado + lo que está diciendo ahora
    msgInput.value = (accumulatedTranscript + interim).trim();
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return; // ignorar silencio, seguir escuchando
    isListening = false;
    btnMic.classList.remove('listening');
    waveform.classList.remove('show');
    msgInput.placeholder = 'Escribe un mensaje...';
  };
}

btnMic.addEventListener('click', () => {
  if (!recognition) { addMsg('jarvis', 'Tu navegador no soporta voz. Usa Chrome en Android.', 'GROQ'); return; }
  if (isListening) {
    // El usuario para → enviar lo acumulado
    const text = (accumulatedTranscript || msgInput.value).trim();
    recognition.stop();
    if (text) { msgInput.value = ''; accumulatedTranscript = ''; send(text); }
  } else {
    recognition.start();
  }
});

// Saludo de bienvenida al abrir
// Pantalla de arranque — el toque desbloquea el audio del navegador
const bootScreen = document.getElementById('boot-screen');
bootScreen.addEventListener('click', () => {
  const hour = new Date().getHours();
  let saludo;
  if (hour >= 5 && hour < 12)       saludo = "Buenos días, señor. Sistemas en línea. ¿En qué trabajamos hoy?";
  else if (hour >= 12 && hour < 20) saludo = "Buenas tardes, señor. Todo listo. ¿Qué necesita?";
  else                               saludo = "Buenas noches, señor. JARVIS en línea. ¿En qué puedo asistirle?";

  const el = document.getElementById('welcome-text');
  if (el) el.textContent = saludo;

  // Fade out boot screen
  bootScreen.style.transition = 'opacity .6s';
  bootScreen.style.opacity = '0';
  setTimeout(() => { bootScreen.style.display = 'none'; }, 600);

  // Reproduce saludo pre-generado (sin lag) luego muestra texto
  const audio = new Audio('/greeting.mp3?t=' + Date.now());
  audio.play().catch(() => speakText(saludo)); // fallback si no está listo
  msgInput.focus();
}, { once: true });

// TTS
let currentAudio = null;
async function speakText(text) {
  try {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const res = await fetch('/speak', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text })
    });
    if (!res.ok) return;
    const blob = await res.blob();
    currentAudio = new Audio(URL.createObjectURL(blob));
    currentAudio.play();
  } catch (e) {}
}

// Keepalive: ping cada 30s mientras la página esté abierta
setInterval(() => fetch('/ping', {method:'POST'}), 30000);
// Ping inmediato al cargar
fetch('/ping', {method:'POST'});
</script>
